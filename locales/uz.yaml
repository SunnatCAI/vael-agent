explainer:
  # Turn-completion explanations and file-mutation footers (agent/turn_explainers.py). Appended to
  # the human-facing reply after the transcript row is written; the model never sees them.
  no_reply_prefix: "⚠️ Javob yo'q: "
  empty_response: "{model} bu safar qayta urinishlardan keyin ham javob yaratmadi. Qayta urinish uchun `continue` yuboring yoki /model bilan modelni almashtiring."
  exit:
    all_retries_exhausted_no_response: "model provayderi barcha qayta urinishlardan keyin javob bermadi. /retry yuboring yoki /model bilan modelni almashtiring."
    partial_stream_recovery: "oqim erta to'xtadi va faqat qisman javob tiklandi. To'xtagan joydan davom etish uchun `continue` yuboring."
    fallback_prior_turn_content: "bu navbatda yangi mazmun yaratilmadi; tiklangan oldingi kontekst ko'rsatilmoqda. Qayta urinish uchun `continue` yuboring."
    redirect_restart_limit_exceeded: "so'rov har urinishda yangi tuzatish bilan bekor qilindi, shuning uchun navbat cheksiz qayta urinish o'rniga to'xtatildi. Oxirgi tuzatishingiz keyingi xabar sifatida navbatga qo'yildi."
    rebuilt_restart_limit_exceeded: "zaxira zanjiridagi har bir provayder ketma-ket muvaffaqiyatsiz bo'ldi, shuning uchun navbat cheksiz qayta urinish o'rniga to'xtatildi. `continue` yuboring yoki provayderni almashtiring."
    budget_exhausted: "navbat uchun iteratsiya/narx byudjeti yakuniy javobdan oldin tugadi. Davom etish uchun `continue` yuboring."
    ollama_runtime_context_too_small: "mahalliy modelning kontekst oynasi tugatish uchun juda kichik edi. Kontekst hajmini oshiring yoki kattaroq modeldan foydalaning."
    pending_tool_result: "vosita natijasi hali kutilayotganda navbat to'xtadi va model keyingi matn yaratmadi. Xulosa qildirish uchun `continue` yuboring."
    interrupted_during_api_call: "so'rov javob olinmasdan oldin chaqiruv o'rtasida uzildi. Qayta urinish uchun `continue` yuboring."
    max_iterations_reached: "yakuniy javobdan oldin vosita iteratsiyalarining maksimal chegarasiga yetildi. Davom etish uchun `continue` yuboring yoki `max_iterations` ni oshiring."
    error_near_max_iterations: "yakuniy javobdan oldin iteratsiya chegarasi yaqinida xato yuz berdi. Yuqoridagi vosita chiqishini tekshiring, so'ng `continue` yuboring."
    repeated_outer_errors: "navbat takroriy xatolar bilan muvaffaqiyatsiz bo'ldi va cheksiz qayta urinish o'rniga erta to'xtatildi. Yuqoridagi xatolarni tekshiring, so'ng qayta urinish uchun `continue` yuboring."
  persistence:
    compression: "navbat to'xtatildi, chunki boshqa jarayon bu sessiyani siqayotgan edi. Xabaringiz allaqachon saqlangan bo'lishi kerak — siqish tugagach qayta yuboring."
    compression_closed: "navbat to'xtatildi, chunki bu sessiya kontekst siqish tufayli almashtirildi va uning jonli davomini qabul qilib bo'lmadi. Xotiraning o'zi sog'lom — yangi sessiya ID sini olishi uchun mijozni yangilang (yoki yangi navbat boshlang), so'ng xabaringizni qayta yuboring."
    turn_lease: "navbat to'xtatildi, chunki boshqa VAEL jarayoni bu sessiyani egalladi. Javobingiz saqlanmadi — boshqa jarayon tugashini kuting, so'ng xabaringizni qayta yuboring."
    session_row_missing: "bu sessiya chat hali ochiq paytida xotiradan o'chirilgan va VAEL uni qayta yarata olmadi, shuning uchun bu xabar saqlanmadi. Xabaringizni qayta yuboring; davom etsa, `vael {profile_arg}doctor` ni ishga tushiring."
    locked: "navbat to'xtatildi, chunki sessiya xotirasi band edi (boshqa VAEL jarayoni state bazasiga yozayotgan edi). Xabaringiz allaqachon saqlangan bo'lishi kerak — birozdan keyin qayta yuboring."
    replaced: "VAEL ishlayotganda sessiya bazasi fayli almashtirildi, shuning uchun bu xabar saqlanmadi (nusxa {home}/sessions/ da saqlangan). VAEL ni to'xtating (`vael {profile_arg}gateway stop`), `vael {profile_arg}doctor` ni ishga tushiring — noto'g'ri faylni joyida tuzatadigan `vael {profile_arg}doctor --fix` ni emas — so'ng uni qayta ishga tushiring va xabaringizni yana bir bor yuboring. Qo'shimcha tiklash qadamlari logda."
    deleted_wal: "boshqa VAEL jarayoni hamon sessiya bazasining write-ahead logi eski nusxasini ushlab turibdi, shuning uchun VAEL faylni xavfsiz saqlash uchun yozishni to'xtatdi va bu xabar saqlanmadi (nusxa {home}/sessions/ da saqlangan). Hech narsa yo'qolmagan. Bu profildagi barcha VAEL jarayonlaridan chiqing (Desktop ilovasi, `vael {profile_arg}gateway stop`, dashboard, cron), `vael {profile_arg}doctor` ni ishga tushiring — u logni hamon ushlab turgan jarayonni nomlaydi — so'ng VAEL ni qayta ishga tushiring va xabaringizni yana bir bor yuboring. Ular ishlab turganda `doctor --fix` ni ishga tushirmang va state.db fayllarini o'chirmang. Qo'llanma: {recovery_docs}"
    corrupt: "navbat to'xtatildi, chunki state bazasi strukturaviy buzilishni bildirdi (transkript qayta ishga tushirishda yo'qolgan bo'lardi). Diskda joy bo'shatish yordam bermaydi. Tiklash variantlari:\n1. `vael {profile_arg}doctor --fix` ni ishga tushiring\n2. Gatewayni to'xtating, so'ng quyidagi bilan tiklang:\n   vael {profile_arg}sessions recover --source {db_path} --inspect-only\n   (tiklash mumkin deb chiqsa) vael {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — tiklash avval shikastlangan faylning nusxasini oladi; jonli state.db ga qarshi `sqlite3 ... \".recover\"` ni ISHGA TUSHIRMANG, zaif sqlite3 CLI uni yanada buzishi mumkin\n3. {backups_dir}/ dagi zaxiradan tiklang\nSo'ng xabaringizni qayta yuboring."
    fts_index: "navbat to'xtatildi, chunki sessiya qidiruv indeksi (FTS5) buzilgan va uni ajratib bo'lmadi, shuning uchun bu xabar saqlanmadi. Xabarlar ombori shikastlanmagan: tiklash vositalarini ishlatmang va zaxiradan tiklamang. `vael {profile_arg}doctor --fix` ni ishga tushiring (yoki VAEL ni qayta ishga tushiring, u ochilganda indeksni tuzatadi), so'ng xabaringizni qayta yuboring."
    disk: "VAEL bu suhbatni diskka saqlay olmadi, shuning uchun xabarlaringiz yo'qolmasligi uchun to'xtadi. Disk ehtimol to'lgan: joy bo'shating (yoki {home}/state.db ruxsatlarini tuzating), so'ng xabaringizni qayta yuboring."
    default: "VAEL bu suhbatni saqlay olmadi, shuning uchun xabarlaringiz yo'qolmasligi uchun to'xtadi. Mumkin sabablar: diskda joy qolmagan yoki boshqa VAEL jarayoni bazani ushlab turibdi. Boshqa VAEL oynalarini yoping, xotirani tekshirish uchun `vael {profile_arg}doctor` ni ishga tushiring, so'ng xabaringizni qayta yuboring."
  file_mutation:
    header: "⚠️ Fayl o'zgarishi tekshiruvchisi: yuqoridagi matn boshqacha ko'rinsa ham, bu navbatda {count} ta fayl tahriri BAJARILMADI. Haqiqatan nima tushganini tasdiqlash uchun `git status` yoki `read_file` ni ishga tushiring."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "bajarilmadi"
  shared:
    and_more: "  • … va yana {count} ta"
    the_model: "Model"

tips:
  # CLI startup / /new discovery tips (vael_cli/tips.py). Zero-padded index keeps YAML
  # order stable; pickers read tips.tNNN for the active language.
  t001: "/bg <prompt> joriy sessiyangiz bo'sh qolgan holda vazifani alohida sessiyada ishga tushiradi; /btw <question> shu suhbat haqidagi yon savolga to'xtatmasdan javob beradi."
  t002: "/branch joriy sessiyani shoxlantiradi, shunda taraqqiyotni yo'qotmasdan boshqa yo'nalishni sinab ko'rishingiz mumkin."
  t003: "/compress suhbat uzayib ketganda kontekstni qo'lda siqadi."
  t004: "/rollback fayl tizimi checkpointlarini ro'yxatlaydi — agent o'zgartirgan fayllarni istalgan oldingi holatga qaytaring."
  t005: "/rollback diff 2 hech narsani tiklamasdan 2-checkpointdan beri nima o'zgarganini ko'rsatadi."
  t006: "/rollback 2 src/file.py bitta faylni aniq checkpointdan tiklaydi."
  t007: "/title \"my project\" sessiyangizga nom beradi — keyinroq /resume yoki vael -c bilan davom ettiring."
  t008: "/resume avval nomlangan sessiyada qolgan joyingizdan davom ettiradi."
  t009: "/queue <prompt> joriy navbatni to'xtatmasdan xabarni keyingi navbatga qo'yadi."
  t010: "/undo suhbatdan oxirgi foydalanuvchi/assistent almashinuvini olib tashlaydi."
  t011: "/retry oxirgi xabaringizni qayta yuboradi — agent javobi unchalik to'g'ri bo'lmaganda foydali."
  t012: "/verbose vosita jarayoni ko'rinishini aylantiradi: off → new → all → verbose."
  t013: "/reasoning high modelning fikrlash chuqurligini oshiradi. /reasoning show mulohazani ko'rsatadi."
  t014: "/fast tezroq API javoblari uchun ustuvor ishlov berishni almashtiradi (provayderga bog'liq)."
  t015: "/yolo sessiya oxirigacha barcha xavfli buyruq tasdiqlash so'rovlarini o'tkazib yuboradi."
  t016: "/model sessiya o'rtasida modellarni almashtirishga imkon beradi — /model sonnet yoki /model gpt-5 ni sinab ko'ring."
  t017: "/model --global standart modelingizni doimiy o'zgartiradi."
  t018: "/personality pirate qiziqarli personalik o'rnatadi — kawaii dan shakespeare gacha 14 ta o'rnatilgan variant."
  t019: "/skin CLI temasini o'zgartiradi — ares, mono, slate, poseidon yoki charizard ni sinab ko'ring."
  t020: "/statusbar model, tokenlar, kontekst to'lish %, narx va davomiylikni ko'rsatadigan doimiy panelni almashtiradi."
  t021: "/tools disable browser joriy sessiya uchun brauzer vositalarini vaqtincha olib tashlaydi."
  t022: "/browser connect brauzer vositalarini ishlayotgan Chromium oilasidagi brauzeringizga CDP orqali ulaydi."
  t023: "/plugins o'rnatilgan plaginlar va ularning holatini ro'yxatlaydi."
  t024: "/cron rejalashtirilgan vazifalarni boshqaradi — istalgan platformaga yetkazish bilan takroriy promptlar o'rnating."
  t025: "/reload-mcp MCP server sozlamasini qayta ishga tushirmasdan qayta yuklaydi."
  t026: "/usage token foydalanishi, narx taqsimoti va sessiya davomiyligini ko'rsatadi."
  t027: "/insights oxirgi 30 kun uchun foydalanish analitikasini ko'rsatadi."
  t028: "/paste vaqtinchalik xotirangizda rasm borligini tekshiradi va uni keyingi xabaringizga biriktiradi."
  t029: "/profile qaysi profil faol va uning uy papkasi qaysiligini ko'rsatadi."
  t030: "/config joriy sozlamalaringizni bir qarashda ko'rsatadi."
  t031: "/stop agent ishga tushirgan barcha ishlayotgan fon jarayonlarini to'xtatadi."
  t032: "@file:path/to/file.py fayl mazmunini to'g'ridan-to'g'ri xabaringizga kiritadi."
  t033: "@file:main.py:10-50 fayldan faqat 10-50 qatorlarni kiritadi."
  t034: "@folder:src/ papka daraxti ro'yxatini kiritadi."
  t035: "@diff bosqichlanmagan git o'zgarishlaringizni xabarga kiritadi."
  t036: "@staged bosqichlangan git o'zgarishlaringizni kiritadi (git diff --staged)."
  t037: "@git:5 oxirgi 5 ta commitni to'liq patchlari bilan kiritadi."
  t038: "@url:https://example.com veb sahifa mazmunini olib kiritadi."
  t039: "@ yozish fayl tizimi yo'li to'ldirishini ishga tushiradi — istalgan faylga interaktiv o'ting."
  t040: "Bir nechta havolani birlashtiring: \"Mosligini tekshirish uchun @file:main.py va @file:test.py ni ko'rib chiq.\""
  t041: "Alt+Enter ko'p qatorli kiritish uchun yangi qator qo'shadi. (Windows Terminal Alt+Enter ni ushlab qoladi — o'rniga Ctrl+Enter dan foydalaning.)"
  t042: "Ctrl+C agentni to'xtatadi. Majburan chiqish uchun 2 soniya ichida ikki marta bosing."
  t043: "Ctrl+Z VAEL ni fonga o'tkazadi — davom ettirish uchun shellda fg ni ishga tushiring."
  t044: "Tab avto-taklif shaffof matnini qabul qiladi yoki slash buyruqlarini avto-to'ldiradi."
  t045: "Agent ishlayotganda yangi xabar yozing — u to'xtatiladi va qayta yo'naltiriladi."
  t046: "Alt+V vaqtincha xotirangizdagi rasmni suhbatga qo'yadi."
  t047: "5 va undan ortiq qatorni qo'yish uni avtomatik faylga saqlaydi va o'rniga ixcham havola kiritadi."
  t048: "vael -c eng oxirgi CLI sessiyangizni davom ettiradi. vael -c \"project name\" sarlavha bo'yicha davom ettiradi."
  t049: "vael -w izolyatsiyalangan git worktree yaratadi — parallel agent ish jarayonlari uchun ideal."
  t050: "vael -w -q \"Fix issue #42\" worktree izolyatsiyasini bir martalik so'rov bilan birlashtiradi."
  t051: "vael chat -t web,terminal diqqatli sessiya uchun faqat aniq toolsetlarni yoqadi."
  t052: "vael chat -s github-pr-workflow ishga tushganda skillni oldindan yuklaydi."
  t053: "vael chat -q \"query\" bitta noaktiv so'rovni ishga tushiradi va chiqadi."
  t054: "vael chat --max-turns 1000 har bir navbat uchun standart 500 iteratsiya chegarasini o'zgartiradi."
  t055: "vael chat --checkpoints har bir buzuvchi fayl o'zgarishidan oldin fayl tizimi snapshotlarini yoqadi."
  t056: "vael --yolo butun sessiya uchun barcha xavfli buyruq tasdiq so'rovlarini chetlab o'tadi."
  t057: "vael chat --source telegram sessiyani vael sessions list da filtrlash uchun belgilaydi."
  t058: "vael -p work chat standart profilingizni o'zgartirmasdan aniq profil ostida ishlaydi."
  t059: "vael doctor --fix sozlama va bog'liqlik muammolarini tashxis qiladi va avtomatik tuzatadi."
  t060: "vael dump ixcham sozlash xulosasini chiqaradi — xato hisobotlari uchun ajoyib."
  t061: "vael config set KEY VALUE maxfiy qiymatlarni avtomatik .env ga, qolganini config.yaml ga yo'naltiradi."
  t062: "vael config edit config.yaml ni standart muharriringizda ochadi."
  t063: "vael config check yetishmayotgan yoki eskirgan sozlama variantlarini skanerlaydi."
  t064: "vael sessions browse qidiruvli interaktiv sessiya tanlagichini ochadi."
  t065: "vael sessions stats platforma bo'yicha sessiyalar soni va baza hajmini ko'rsatadi."
  t066: "vael sessions prune --older-than 30 eski sessiyalarni tozalaydi."
  t067: "vael skills search react --source skills-sh skills.sh ommaviy katalogidan qidiradi."
  t068: "vael skills check o'rnatilgan hub skill'larini yuqori oqim yangilanishlari uchun skanerlaydi."
  t069: "vael skills tap add myorg/skills-repo maxsus GitHub skill manbasini qo'shadi."
  t070: "vael skills snapshot export setup.json skill sozlamangizni zaxira yoki ulashish uchun eksport qiladi."
  t071: "vael mcp add github --command npx buyruq satridan MCP serverlarini qo'shadi."
  t072: "vael mcp serve VAEL ning o'zini boshqa agentlar uchun MCP server sifatida ishga tushiradi."
  t073: "vael auth add hisob ma'lumotlari havzasi aylanishi uchun bir nechta API kalit qo'shishga imkon beradi."
  t074: "vael completion bash >> ~/.bashrc barcha buyruqlar va profillar uchun tab to'ldirishni yoqadi."
  t075: "vael logs -f agent.log ni real vaqtda kuzatadi. --level WARNING --since 1h chiqishni filtrlaydi."
