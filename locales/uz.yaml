  t249: "Agent ishlayotganda har bir to'xtatish vaqt belgilari bilan ~/.vael/interrupt_debug.log ga yoziladi."
  t250: "BROWSER_CDP_URL brauzer vositalarini istalgan ishlayotgan Chromium oilasidagi brauzerga ulaydi — WebSocket, HTTP yoki host:port qabul qiladi."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true maxsus Chromium bilan ilg'or aniqlanishga qarshi himoyani yoqadi (Scale Plan)."
  t252: "CLI 80 ustundan tor terminallarda avtomatik ixcham rejimga o'tadi."
  t253: "Tezkor buyruqlar ikki turni qo'llab-quvvatlaydi: exec (shell buyrug'ini to'g'ridan-to'g'ri ishga tushirish) va alias (boshqa buyruqqa yo'naltirish)."
  t254: "Vazifa bo'yicha delegatsiya modeli: sozlamadagi delegation.model va delegation.provider subagentlarni arzonroq modellarga yo'naltiradi."
  t255: "delegation.reasoning_effort subagentlar uchun fikrlash chuqurligini mustaqil boshqaradi."
  t256: "config.yaml dagi display.platforms platforma bo'yicha ko'rinishni o'zgartirishga imkon beradi: {telegram: {tool_progress: all}}."
  t257: "Sozlamadagi human_delay.mode odam yozish tezligini taqlid qiladi — sozlanadigan min_ms/max_ms oralig'i."
  t258: "Sozlama versiyasi migratsiyalari yuklashda avtomatik ishlaydi — yangi sozlama kalitlari qo'lda aralashuvsiz paydo bo'ladi."
  t259: "GPT va Codex modellari vosita intizomi va majburiy vosita ishlatish bo'yicha maxsus tizim prompti ko'rsatmasini oladi."
  t260: "Gemini modellari mutlaq yo'llar, parallel vosita chaqiruvlari va noaktiv buyruqlar uchun moslashtirilgan direktivalarni oladi."
  t261: "config.yaml dagi context.engine muqobil kontekst boshqarish strategiyalari uchun plagin nomiga o'rnatilishi mumkin."
  t262: "15 000 belgidan oshgan brauzer sahifa snapshotlari qisqartiriladi yoki avtomatik xulosa qilinadi; to'liq snapshot read_file sahifalash uchun cache/web ga saqlanadi."
  t263: "Siqgich arzon oldindan o'tishni bajaradi: 200 belgidan oshgan vosita chiqishlari LLM ishlashidan oldin o'rinbosarlar bilan almashtiriladi."
  t264: "Siqish bajarilmaganda, API ni bosimga solmaslik uchun keyingi urinishlar 10 daqiqaga to'xtatiladi."
  t265: "Uzun xavfli buyruqlar (>70 belgi) tasdiqlash so'rovida avval to'liq matnni ko'rish uchun 'view' variantini oladi."
  t266: "Audio daraja vizualizatsiyasi ovoz yozish paytida mikrofon RMS darajalariga asoslangan ▁▂▃▄▅▆▇ chiziqlarini ko'rsatadi."
  t267: "Profil nomlari mavjud PATH binar fayllari bilan to'qnashmasligi kerak — 'vael profile create ls' rad etiladi."
  t268: "vael profile create backup --clone-all hamma narsani nusxalaydi (sozlama, kalitlar, SOUL.md, xotiralar, skill'lar, sessiyalar)."
  t269: "Ovoz yozish tugmasi config.yaml dagi voice.record_key orqali sozlanadi — faqat Ctrl+B emas."
  t270: ".cursorrules va .cursor/rules/*.mdc fayllari avtomatik aniqlanadi va loyiha konteksti sifatida yuklanadi."
  t271: "Kontekst fayllari 10+ prompt inyeksiyasi andozalarini qo'llab-quvvatlaydi — ko'rinmas Unicode, 'ko'rsatmalarni e'tiborsiz qoldir', ma'lumot o'g'irlash urinishlari."
  t272: "GPT-5 va Codex xabar formatida 'system' o'rniga 'developer' rolidan foydalanadi."
  t273: "Vazifa bo'yicha yordamchi o'zgartirishlar: config.yaml da auxiliary.vision.provider, auxiliary.compression.model va h.k."
  t274: "Yordamchi mijoz 'main' ni provayder sinonimi deb biladi — haqiqiy asosiy provayder + modelingizga aylanadi."
  t275: "vael claw migrate --dry-run hech narsa yozmasdan OpenClaw migratsiyasini oldindan ko'rsatadi."
  t276: "Qo'shtirnoq yoki ekranlangan bo'shliqlar bilan qo'yilgan fayl yo'llari avtomatik ishlanadi — qo'lda tozalash shart emas."
  t277: "Slash buyruqlar hech qachon katta qo'yishni yig'ishni ishga tushirmaydi — katta argumentli /command to'g'ri ishlaydi."
  t278: "To'xtatish rejimida agent bajarilayotganda yozilgan slash buyruqlar to'xtatish mantiqini chetlab o'tadi va darhol ishlaydi."
  t279: "VAEL_DEV=1 mahalliy ishlab chiqish uchun konteyner rejimini aniqlashni chetlab o'tadi."
  t280: "Har bir MCP serveri o'zining toolsetiga (mcp-servername) ega bo'lib, uni vael tools orqali mustaqil almashtirish mumkin."
  t281: "Sozlamadagi MCP ${ENV_VAR} o'rinbosarlari server ishga tushganda hal qilinadi — ~/.vael/.env dagi o'zgaruvchilar ham."
  t282: "Ishonchli repolardagi (NousResearch) skill'lar 'trusted' xavfsizlik darajasini oladi; jamoa skill'lari qo'shimcha skanerlanadi."
  t283: "~/.vael/skills/.hub/quarantine/ dagi skill karantini xavfsizlik ko'rib chiqishi kutayotgan skill'larni saqlaydi."
  t284: "/steer <prompt> keyingi vosita chaqiruvidan so'ng eslatma kiritadi — vazifa o'rtasida to'xtatmasdan yo'nalishni sozlang."
  t285: "/goal <text> doimiy Ralph-loop maqsadini belgilaydi — VAEL hakam tugadi demaguncha navbatma-navbat avtomatik davom etadi."
  t286: "/snapshot create [label] VAEL sozlamasining to'liq holat snapshotini saqlaydi; /snapshot restore <id> keyinroq qaytaradi."
  t287: "/copy [N] oxirgi assistent javobini vaqtincha xotirangizga nusxalaydi yoki raqam bilan oxiridan N-chisini."
  t288: "/redraw butun UI ni majburan qayta chizadi, tmux o'lchamini o'zgartirishdan keyingi terminal og'ishi yoki sichqoncha tanlash artefaktlarini tuzatadi."
  t289: "/agents (sinonim /tasks) joriy sessiya bo'yicha faol agentlar va ishlayotgan fon vazifalarini ko'rsatadi."
  t290: "/footer yakuniy javoblardagi model, kontekst % va cwd ni ko'rsatadigan gateway quyi qismini almashtiradi."
  t291: "/busy queue|steer|interrupt VAEL ishlayotganda Enter bosish nima qilishini boshqaradi."
  t292: "Telegram DM dagi /topic foydalanuvchi boshqaradigan ko'p sessiyali mavzu rejimini yoqadi — /topic <id> oldingi sessiyalarni joyida tiklaydi."
  t293: "/approve session|always kutilayotgan xavfli buyruqni siz tanlagan ishonch qamrovi bilan ishga tushiradi; /deny uni rad etadi."
  t294: "/restart faol ishlar tugagach gatewayni ravon qayta ishga tushiradi, so'ng qaytganda so'rovchiga xabar beradi."
  t295: "/kanban boards switch <slug> chat ichidan faol ko'p loyihali Kanban doskasini o'zgartiradi."
  t296: "/reload ~/.vael/.env ni ishlayotgan sessiyaga qayta yuklaydi — yangi API kalitlarini qayta ishga tushirmasdan oling."
  t297: "no_agent=True bilan cronjob skriptni jadval bo'yicha ishga tushiradi va stdout ini to'g'ridan-to'g'ri yuboradi — nol token, nol LLM."
  t298: "Bo'sh cron skript stdout i jim tik degani — hech narsa yetkazilmaydi, chegara kuzatuvchilari uchun ideal."
  t299: "VAEL_CRON_MAX_PARALLEL (standart 4) har bir tikda nechta cron ishi ishlashini cheklaydi, shunda portlashlar kalitlaringizni to'ydirmaydi."
  t300: "Gateway hooklari ~/.vael/hooks/<name>/ ostida HOOK.yaml + handler.py bilan yashaydi — handler `handle` deb nomlanishi kerak."
  t301: "Hook hodisalari gateway:startup, session:start, agent:step va command:* wildcard obunalarini o'z ichiga oladi."
  t302: "~/.vael/BOOT.md nazorat ro'yxatini tashlang va gateway:startup hooki uni har yuklanishda bir martalik agent sifatida ishga tushiradi."
  t303: "vael curator run --dry-run hech narsani o'zgartirmasdan kurator nimani arxivlashi yoki birlashtirishini oldindan ko'rsatadi."
  t304: "vael curator pin <skill> skillni avtomatik arxivlashdan ham, agentning skill_manage vositasidan ham qat'iy himoyalaydi."
  t305: "vael curator rollback skill'larni ishga tushirishdan oldingi snapshotdan tiklaydi — zaxiralar skills/.curator_backups/ ostida."
  t306: "vael auth reset <provider> [target] butun hisob ma'lumotlari havzasidagi yoki bitta hisob ma'lumotidagi (indeks, id yoki yorliq bo'yicha) sovish va tugash bayroqlarini tozalaydi."
  t307: "credential_pool_strategies.<provider>: round_robin fill_first standartiga qaraganda kalitlarni teng aylantiradi."
  t308: "Vosita bo'yicha use_gateway: true veb, rasm, tts yoki brauzerni Nous obunangiz orqali yo'naltiradi — qo'shimcha kalit kerak emas."
  t309: "provider_routing.data_collection: deny OpenRouter da ma'lumot saqlovchi provayderlarni chiqarib tashlaydi."
  t310: "provider_routing.require_parameters: true so'rovingizdagi har bir parametrni qo'llab-quvvatlaydigan provayderlarga yo'naltiradi."
  t311: "VAEL_TUI_RESUME=1 ishga tushganda eng oxirgi TUI sessiyasiga avtomatik qayta ulanadi — SSH uzilgandan keyin qulay."
  t312: "VAEL_TUI_THEME=light|dark|<hex> COLORFGBG ni o'rnatmaydigan terminallarda TUI temasini majburlaydi."
  t313: "TUI da Ctrl+G yoki Ctrl+X Ctrl+E uzun ko'p qatorli promptlar uchun kiritish buferini $EDITOR da ochadi."
  t314: "TUI LaTeX ni qatorda chizadi — $E=mc^2$ xom TeX o'rniga Unicode matematikaga aylanadi."
  t315: "vael dashboard 127.0.0.1:9119 da mahalliy veb UI ni ishga tushiradi — hech qanday ma'lumot localhost dan chiqmaydi."
  t316: "vael dashboard to'liq VAEL TUI ni brauzeringizga xterm.js va WebSocket PTY orqali joylaydi."
  t317: "Butun dashboardni qayta bezash uchun ~/.vael/dashboard-themes/ ga ikkita palitra rangli YAML tashlang."
  t318: "Dashboard plaginlari tashlab qo'yiladi: ~/.vael/dashboard-plugins/ da manifest.json + JS bundle — npm build shart emas."
  t319: "Dashboard temasidagi layoutVariant: cockpit plaginlar sidebar slot orqali to'ldirishi mumkin bo'lgan 260px chap relsni qo'shadi."
  t320: "display.tool_progress_command: true xabar almashish platformalarida /verbose ni ochadi; standart bo'yicha faqat CLI da."
  t321: "VAEL_BACKGROUND_NOTIFICATIONS=result faqat fon vazifalari tugaganda xabar beradi (concise/all/error/off ga qarshi)."
  t322: "VAEL_WRITE_SAFE_ROOT write_file/patch ni papka prefikslari bilan cheklaydi; bir nechta yo'l os.pathsep (: yoki ;) orqali."
  t323: "VAEL_IGNORE_RULES AGENTS.md, SOUL.md, .cursorrules, xotira va oldindan yuklangan skill'larning avtomatik kiritilishini o'tkazib yuboradi."
  t324: "VAEL_ACCEPT_HOOKS config.yaml da e'lon qilingan ko'rilmagan shell hooklarini TTY so'rovisiz avtomatik tasdiqlaydi."
  t325: "auxiliary.goal_judge.model /goal hakamini arzon tez modelga yo'naltiradi va sikl narxini nolga yaqin tutadi."
  t326: "Checkpointlar ulkan monorepolarda sekin git amallaridan qochish uchun 50 000 dan ortiq fayli bo'lgan papkalarni o'tkazib yuboradi."
  t327: "tts.provider: piper 44 tilli mahalliy TTS ni CPU da ishga tushiradi — ovozlar ~/.vael/cache/piper-voices/ ga avtomatik yuklanadi."
  t328: "tts.providers.<name>.type: command istalgan CLI TTS dvigatelini {input_path} va {output_path} o'rinbosarlari bilan ulaydi."
  t329: "API_SERVER_ENABLED=true gateway bilan birga Open WebUI va LibreChat uchun OpenAI-mos endpointni ishga tushiradi."
  t330: "GATEWAY_PROXY_URL bo'lingan sozlamani ishga tushiradi: platforma I/O mahalliy, agent ishi masofaviy API serverga topshiriladi."
  t331: "MATRIX_DEVICE_ID E2EE uchun barqaror qurilma ID sini mahkamlaydi — usiz kalitlar har ishga tushganda almashadi va tarixiy shifrni ochish buziladi."
  t332: "TELEGRAM_WEBHOOK_URL o'rnatilganda TELEGRAM_WEBHOOK_SECRET majburiy — openssl rand -hex 32 bilan yarating."
  t333: "batch_runner.py --resume content-matches tugallangan promptlarni matn bo'yicha moslashtiradi, shuning uchun to'plam qayta tartiblanganda tugagan ish qayta ishlamaydi."
  t334: "/new joyida yangi sessiya boshlaydi (sinonim /reset) — yangi sessiya ID si, toza tarix, CLI ochiq qoladi."
  t335: "/clear terminal ekranini tozalaydi VA yangi sessiya boshlaydi — vizual tiklash uchun bitta yorliq."
  t336: "/history joriy suhbatni CLI dan chiqmasdan qatorda chop etadi — tezda qayta o'qish uchun foydali."
  t337: "/save joriy suhbatni sessiyani tugatmasdan diskka yozadi."
  t338: "/status sessiya ma'lumotini bir qarashda ko'rsatadi: ID, sarlavha, model, token foydalanishi va o'tgan vaqt."
  t339: "/image <path> keyingi promptingiz uchun mahalliy rasm faylini qo'yish yoki sudrashsiz biriktiradi."
  t340: "/platforms gateway va xabar almashish platformalari ulanish holatini chat ichidan ko'rsatadi."
  t341: "/commands to'liq slash-buyruq + o'rnatilgan skill ro'yxatini sahifalaydi — tab to'ldirishsiz platformalarda foydali."
  t342: "/toolsets har bir mavjud toolsetni ro'yxatlaydi, shunda -t/--toolsets nimani qabul qilishini bilasiz."
  t343: "/voice tts faqat TTS rejimini almashtiradi — agent ovoz bilan javob beradi, lekin promptlarni yozasiz."
  t344: "/reload-skills ~/.vael/skills/ ni qayta skanerlaydi, shunda tashlab qo'yilgan skill'lar sessiyani qayta ishga tushirmasdan paydo bo'ladi."
  t345: "/indicator kaomoji|emoji|unicode|ascii agent ishlayotganda ko'rsatiladigan TUI band ko'rsatkichi uslubini tanlaydi."
  t346: "/debug qo'llab-quvvatlash to'plamini (tizim ma'lumoti + loglar) yuklaydi va ulashiladigan havolalarni qaytaradi — chatda ham ishlaydi."
  t347: "vael -z \"<prompt>\" eng sof bir martalik: yakuniy javob stdout ga, boshqa hech narsa yo'q — skriptlarda quvur uchun ideal."
  t348: "vael chat --pass-session-id sessiya ID sini tizim promptiga kiritadi, shunda agent o'ziga murojaat qila oladi."
  t349: "vael chat --image path/to/pic.png mahalliy rasmni alohida yuklashsiz bitta -q so'roviga biriktiradi."
  t350: "vael chat --ignore-user-config faol foydalanuvchi sozlamasini o'tkazib yuboradi — takrorlanadigan xato hisobotlari va CI ishga tushirishlari."
  t351: "vael chat --source tool dasturiy chatlarni belgilaydi, shunda ular vael sessions list ni to'ldirmaydi."
  t352: "vael dump --show-keys chuqurroq qo'llab-quvvatlash debagi uchun yashirilgan API kalit barmoq izlarini kiritadi."
  t353: "vael sessions rename <ID> \"new title\" istalgan oldingi sessiyani qayta nomlaydi; vael sessions delete <ID> birini o'chiradi."
  t354: "vael import to'liq VAEL zaxira zipini tiklaydi; sessiya JSON/JSONL eksportlari dashboard Sessions sahifasidan import qilinadi."
  t355: "vael fallback fallback_model zanjirini interaktiv boshqaradi — config.yaml ni qo'lda tahrirlash shart emas."
  t356: "vael pairing DM juftlash tokenini aylantiradi — aylantirishdan keyingi birinchi yozgan kishi botga kirishni oladi."
  t357: "vael setup birinchi marta foydalanuvchilarni provayder, kalitlar va platforma ulanishi bo'yicha bitta interaktiv jarayonda yo'naltiradi."
  t358: "vael status --deep har bir komponent bo'yicha to'liq sog'liq tekshiruvini ishga tushiradi; oddiy vael status tezkor ko'rinish."
  t359: "VAEL_AGENT_TIMEOUT=0 ishlayotgan agent uchun gateway faolsizlik o'chirishini o'chiradi — uzoq tadqiqot ishlari uchun."
  t360: "VAEL_ENABLE_PROJECT_PLUGINS=1 repo ichidagi plaginlarni ./.vael/plugins/ dan avtomatik yuklaydi — dizayn bo'yicha ishonch bilan cheklangan."
  t361: "VAEL_DISABLE_FILE_STATE_GUARD=1 patch va write_file dagi 'o'qiganingizdan beri fayl o'zgardi' himoyasini o'chiradi."
  t362: "VAEL_ALLOW_PRIVATE_URLS=true veb vositalarga localhost va shaxsiy tarmoqlarga kirishga ruxsat beradi — gateway rejimida standart bo'yicha o'chiq."
  t363: "VAEL_OPTIONAL_SKILLS=name1,name2 birinchi ishga tushishda profil bo'yicha qo'shimcha ixtiyoriy katalog skill'larini avtomatik o'rnatadi."
  t364: "VAEL_BUNDLED_SKILLS maxsus o'rnatilgan skill daraxtini ko'rsatadi — Homebrew va Nix paketlash tomonidan ishlatiladi."
  t365: "VAEL_DUMP_REQUEST_STDOUT=1 har bir API so'rov yukini log fayllari o'rniga stdout ga chiqaradi."
  t366: "VAEL_OAUTH_TRACE=1 provayder autentifikatsiyasini debag qilish uchun yashirilgan OAuth token almashinuvi va yangilash urinishlarini loglaydi."
  t367: "VAEL_STREAM_RETRIES (standart 3) vaqtinchalik tarmoq xatolarida oqim o'rtasidagi qayta ulanish urinishlarini boshqaradi."
  t368: "VAEL_GATEWAY_BUSY_ACK_ENABLED=false foydalanuvchi band agentga yozganda ⚡/⏳/⏩ tasdiq xabarlarini o'chiradi."
  t369: "VAEL_AGENT_NOTIFY_INTERVAL (standart 180s) gateway uzoq navbatlar haqida qanchalik tez-tez jarayon xabari yuborishini belgilaydi."
  t370: "VAEL_RESTART_DRAIN_TIMEOUT (standart 900s) /restart majburlashdan oldin bajarilayotgan ishlarni qancha kutishini cheklaydi."
  t371: "VAEL_CHECKPOINT_TIMEOUT (standart 30s) fayl tizimi checkpoint yaratishni cheklaydi — ulkan monorepolarda oshiring."
  t372: "config.yaml dagi image_gen.model FAL modelini tanlaydi: flux-2/klein, gpt-image-2, nano-banana-pro va boshqalar."
  t373: "image_gen.provider rasm yaratishni standart o'rniga plagin (OpenAI Images, Codex, FAL) orqali yo'naltiradi."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY ko'rish tahlilini istalgan OpenAI-mos endpointga yo'naltiradi."
  t375: "security.tirith_fail_open: false tirith skaneri o'zi xatoga uchraganda VAEL buyruqlarni bloklashini ta'minlaydi."
  t376: "TIRITH_FAIL_OPEN muhit o'zgaruvchisi tirith_fail_open sozlamasini bekor qiladi — config.yaml ni tahrirlamasdan tezkor almashtirish."
  t377: "--source tool chatlari vael sessions list dan standart bo'yicha chiqarib tashlanadi — ularni ko'rish uchun --source ni aniq belgilang."
  t378: "Sessiya ID lari vaqt belgisi prefiksi bilan (20250305_091523_abcd), shuning uchun ls va jq da saralash tabiiy ishlaydi."
  t379: "API_SERVER_MODEL_NAME /v1/models dagi model nomini sozlaydi — ko'p profilli Open WebUI sozlamalari uchun muhim."
  t380: "Dashboard plaginlari /dashboard-plugins/<name>/ dan taqdim etiladi — fayllarni ~/.vael/dashboard-plugins/ ga tashlang."
  # Empty-composer example prompts (TUI). Generic on purpose: VAEL is not coding-only.
  placeholder:
    p01: "Istalgan narsani so'rang yoki buyruqlar uchun / yozing…"
    p02: "Shu papkada nima borligini xulosa qilib ber"
    p03: "Pochta qutimdagi oxirgi xatga javob qoralamasini yoz"
    p04: "Funksiyani rejalashtir, so'ng uni qadamma-qadam qur"
    p05: "Muvaffaqiyatsiz testni top va tuzat"
    p06: "Shu mavzuni o'rgan va menga qisqa ma'lumot yoz"
    p07: "Bu repoda yaqinda nima o'zgargan?"
    p08: "Shu eslatmalarni vazifalar ro'yxatiga aylantir"
    p09: "Shu xatoni tushuntir va qanday tuzatishni ayt"
    p10: "Eslatma o'rnat yoki takroriy vazifani rejalashtir"
    p11: "Buyruqlarni ko'rish uchun / yozing yoki palitra uchun Ctrl+P"
